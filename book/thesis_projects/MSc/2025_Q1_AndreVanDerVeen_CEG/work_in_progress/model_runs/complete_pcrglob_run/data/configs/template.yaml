version: 1

experiment:
  name: prefactor_3stations_overnight
  run_id: 1
  output_root: model_runs/complete_pcrglob_run/outputs/pcrglobwb
  output_naming: "{name}/run_{run_id}_{timestamp}"
  timestamp_format: "%Y%m%d_%H%M%S"

model:
  version: "16mar"
  bmi_image: /home/avandervee3/ewatercycle_pcr_16mar.sif
  calibration_period:
    start: "1949-11-01T00:00:00Z"
    end: "1950-12-31T00:00:00Z"
  spinup_days: 60

paths:
  # Paths below are relative to this config file directory: data/configs/
  template_ini: test_container_prefactor_2.ini
  forcing_dir: ../forcing/pcrglobwb
  params_dir: ../params/pcrglobwb
  clone_map: ../clonemaps/aral_basin_05min.map
  landmask: ../clonemaps/aral_basin_05min.map
  grdc_daily_dir: ../grdc/Daily

stations:
  - name: Chatly
    station_key: Chatly
    grdc_id: "2817100"
    weight: 1.0
  - name: Garm
    station_key: Garm
    grdc_id: "2517920"
    weight: 1.0
  - name: Uch-Kurgan
    station_key: Uch-Kurgan
    grdc_id: "2416850"
    weight: 1.0

optimizer:
  algorithm: cmaes
  sigma0: 0.2
  maxiter: 10
  tolfun: 1.0e-6
  bounds_normalized: [0.0, 1.0]
  workers:
    mode: auto
    reserve_cores: 1
    explicit_n_workers: null
  population:
    mode: auto
    multiplier: 2
    explicit_pop_size: null
  initial_perturbation:
    enabled: true
    min: -0.05
    max: 0.05
    seed_formula: "run_id * 42"
  cma_seed_formula: "run_id * 1000"

runtime:
  force_gc_after_run: true
  remove_run_dir_after_eval: false
  fail_objective_penalty: 999.0
  write_run_manifest: true
  write_candidate_rows: true

objective:
  station_metric_weights:
    nse: 0.5
    kge: 0.5

calibration_parameters:
  referenceEPotFactor:
    ini_section: meteoOptions
    ini_key: referenceEPotFactor
    bounds: [0.5, 2.0]
    initial: 1.0
  precipitationFactor:
    ini_section: meteoOptions
    ini_key: precipitationFactor
    bounds: [0.4, 1.5]
    initial: 1.0
  temperatureFactor:
    ini_section: meteoOptions
    ini_key: temperatureFactor
    bounds: [0.8, 1.2]
    initial: 1.0
  temperatureConstant:
    ini_section: meteoOptions
    ini_key: temperatureConstant
    bounds: [-277.15, -269.15]
    initial: -273.15
  maximize_irrigation_threshold:
    ini_section: landSurfaceOptions
    ini_key: treshold_to_maximize_irrigation_surface_water
    bounds: [0.4, 0.6]
    initial: 0.5
  manningsN:
    ini_section: routingOptions
    ini_key: manningsN
    bounds: [0.005, 0.1]
    initial: 0.04
  multiplier_for_storCap:
    ini_section: prefactorOptions
    ini_key: linear_multiplier_for_storCap
    bounds: [0.5, 5.0]
    initial: 3.0
  multiplier_for_recessionCoeff:
    ini_section: prefactorOptions
    ini_key: log_10_multiplier_for_recessionCoeff
    bounds: [0.5, 5.0]
    initial: 1.0
  multiplier_for_kSat:
    ini_section: prefactorOptions
    ini_key: log_10_multiplier_for_kSat
    bounds: [0.5, 5.0]
    initial: 3.0